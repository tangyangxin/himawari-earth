name: Update Himawari Wallpaper


on:

  schedule:
    # 每20分钟运行
    - cron: "*/20 * * * *"

  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"


    - name: Install dependencies
      run: |
        pip install -r requirements.txt


    - name: Generate wallpaper
      run: |
        python main.py


    # 保存历史图片
    - name: Update history
      run: |

        mkdir -p history

        TIME=$(date -u +"%Y%m%d_%H%M")

        cp output/earth.webp \
        history/earth_${TIME}.webp


        python <<EOF
        import json
        import os
        from datetime import datetime, timedelta


        file="history.json"


        if os.path.exists(file):
            with open(file) as f:
                data=json.load(f)
        else:
            data=[]


        now=datetime.utcnow()


        data.append({
            "file":
            "history/earth_${TIME}.webp",
            "time":
            now.strftime("%Y-%m-%d %H:%M:%S UTC")
        })


        # 保留24小时
        cutoff=now-timedelta(hours=24)


        new=[]

        for item in data:
            t=datetime.strptime(
                item["time"],
                "%Y-%m-%d %H:%M:%S UTC"
            )

            if t>cutoff:
                new.append(item)

        data=new


        with open(file,"w") as f:
            json.dump(
                data,
                f,
                indent=2
            )

        EOF



    # 清理旧图片
    - name: Clean old history images
      run: |

        python <<EOF
        import json
        import os

        with open("history.json") as f:
            data=json.load(f)


        keep=set(
            x["file"]
            for x in data
        )


        for f in os.listdir("history"):

            path="history/"+f

            if path not in keep:

                os.remove(path)

        EOF



    - name: Commit images
      run: |

        git config user.name "github-actions"

        git config user.email \
        "github-actions@github.com"


        git add output/
        git add history/
        git add history.json


        git commit \
        -m "update wallpaper history" \
        || echo "No changes"


        git push



    - name: Setup Pages
      uses: actions/configure-pages@v5


    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .


    - name: Deploy Pages
      uses: actions/deploy-pages@v4
