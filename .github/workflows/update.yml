name: Update Himawari Wallpaper


on:

  schedule:

    # 每小时更新一次

    - cron: "0 * * * *"


  workflow_dispatch:



permissions:

  contents: write

  pages: write

  id-token: write




jobs:


  update:



    runs-on: ubuntu-latest



    steps:


      # ===================
      # Checkout
      # ===================

      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0




      # ===================
      # Python
      # ===================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"




      - name: Install dependencies

        run: |

          pip install -r requirements.txt





      # ===================
      # Generate
      # ===================

      - name: Generate images

        run: |

          python main.py





      # ===================
      # Prepare Pages
      # ===================

      - name: Prepare Pages

        run: |


          mkdir -p public/history



          # 当前图片

          cp output/earth_desktop.webp \
          public/earth_desktop.webp


          cp output/earth_phone.webp \
          public/earth_phone.webp




          # 当前时间

          TIME=$(date -u +"%Y%m%d_%H%M")

          TEXT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")



          echo $TEXT_TIME \
          > public/update.txt





          # =====================
          # 保存历史帧
          # =====================


          cp output/earth_desktop.webp \
          public/history/earth_${TIME}.webp




          echo "Current history:"

          ls -lh public/history





      # =====================
      # 删除24小时前文件
      # =====================

      - name: Clean old history

        run: |


          find public/history \
          -type f \
          -name "*.webp" \
          -mmin +1440 \
          -delete




          echo "After cleanup:"

          ls -lh public/history





      # =====================
      # Setup Pages
      # =====================

      - name: Setup Pages

        uses: actions/configure-pages@v5




      # =====================
      # Upload
      # =====================

      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: ./public





  deploy:



    needs: update


    runs-on: ubuntu-latest



    steps:


      - name: Deploy to GitHub Pages

        uses: actions/deploy-pages@v4
