name: Update Himawari Wallpaper


on:
  repository_dispatch:
    types:
      - update-wallpaper

  workflow_dispatch:


# 防止多个 Cloudflare 触发导致 git push 冲突
concurrency:
  group: himawari-update
  cancel-in-progress: false


permissions:
  contents: write
  pages: write
  id-token: write


jobs:

  update:

    name: update-wallpaper

    runs-on: ubuntu-latest


    steps:

      # =========================
      # Checkout
      # =========================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0



      # =========================
      # Python
      # =========================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.x"



      - name: Install dependencies

        run: |

          pip install -r requirements.txt



      # =========================
      # Generate wallpaper
      # =========================

      - name: Generate wallpaper

        run: |

          python main.py



      # =========================
      # Update history.json
      # =========================

      - name: Update history

        run: |

          mkdir -p history


          python <<'PY'

          import os
          import json
          from datetime import datetime


          history_file = "history.json"


          if os.path.exists(history_file):

              try:
                  with open(history_file,"r") as f:
                      history=json.load(f)

              except:

                  history=[]

          else:

              history=[]



          files=[]

          for root,dirs,names in os.walk("history"):

              for name in names:

                  if name.endswith(".webp"):

                      files.append(
                          os.path.join(root,name)
                      )


          files.sort(reverse=True)



          if files:

              latest=files[0]

              history.insert(
                  0,
                  {
                    "image": latest,
                    "time": datetime.utcnow().isoformat()
                  }
              )


          # 保留最近100张

          history=history[:100]


          with open(history_file,"w") as f:

              json.dump(
                  history,
                  f,
                  indent=2
              )

          PY



      # =========================
      # Clean old images
      # =========================

      - name: Clean old history images

        run: |

          python <<'PY'

          import os


          folder="history"


          files=[]


          for f in os.listdir(folder):

              if f.endswith(".webp"):

                  files.append(
                      os.path.join(folder,f)
                  )


          files.sort(reverse=True)


          for f in files[100:]:

              os.remove(f)


          PY



      # =========================
      # Commit
      # =========================

      - name: Commit images

        run: |


          git config user.name "github-actions"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add .



          git commit \
            -m "update wallpaper history" \
            || echo "No changes"



          # 防止远程更新导致 push 失败

          git pull --rebase origin main



          git push



      # =========================
      # GitHub Pages
      # =========================

      - name: Setup Pages

        uses: actions/configure-pages@v5



      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: .



      - name: Deploy Pages

        uses: actions/deploy-pages@v4
