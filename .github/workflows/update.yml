name: Update Himawari Wallpaper


on:

  workflow_dispatch:


  schedule:

    # 每10分钟运行
    - cron: "*/60 * * * *"



permissions:

  contents: read

  pages: write

  id-token: write



jobs:


  update:


    name: Generate wallpaper

    runs-on: ubuntu-latest



    steps:


      # 获取代码

      - name: Checkout

        uses: actions/checkout@v4



      # Python环境

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      # 安装依赖

      - name: Install dependencies

        run: |

          pip install -r requirements.txt



      # 生成图片

      - name: Generate images

        run:

          python main.py



      # 创建Pages内容

      - name: Prepare Pages

        run: |

          mkdir -p public


          # 当前固定URL图片

          cp output/earth_phone.webp public/earth_phone.webp

          cp output/earth_desktop.webp public/earth_desktop.webp



          # 生成时间戳

          TIME=$(date -u +"%Y%m%d_%H%M%S")


          # 历史版本图片

          cp output/earth_phone.webp \
          public/earth_phone_${TIME}.webp


          cp output/earth_desktop.webp \
          public/earth_desktop_${TIME}.webp



          # 更新时间文件

          date -u +"%Y-%m-%d %H:%M:%S UTC" \
          > public/update.txt



          # 创建主页

          cat > public/index.html <<EOF


          <!DOCTYPE html>

          <html>


          <head>

          <meta charset="utf-8">

          <title>Himawari Earth</title>


          <meta name="viewport"
          content="width=device-width, initial-scale=1">


          <style>


          body {

              background:black;

              color:white;

              text-align:center;

              font-family:Arial,sans-serif;

          }



          img {

              width:90%;

              max-width:600px;

          }



          a {

              color:white;

          }


          </style>


          </head>



          <body>


          <h2>
          Latest Himawari Earth
          </h2>



          <img src="earth_phone.webp">



          <p>

          <a href="earth_phone.webp">

          Phone Wallpaper

          </a>

          </p>



          <p>

          <a href="earth_desktop.webp">

          Desktop Wallpaper

          </a>

          </p>



          <p>

          Updated:

          <span id="time">

          loading...

          </span>

          </p>




          <script>


          fetch("update.txt")

          .then(r=>r.text())

          .then(t=>{

              document
              .getElementById("time")
              .innerHTML=t;

          })


          </script>



          </body>


          </html>


          EOF





      # 上传Pages

      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: public





  deploy:


    name: Deploy Pages


    needs: update


    runs-on: ubuntu-latest



    environment:


      name: github-pages


      url: ${{ steps.deployment.outputs.page_url }}



    steps:



      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
