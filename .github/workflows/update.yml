name: Update Himawari Wallpaper


on:
  repository_dispatch:
    types:
      - update-wallpaper

  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: himawari-update
  cancel-in-progress: false


jobs:

  update:

    name: update-wallpaper

    runs-on: ubuntu-latest

    timeout-minutes: 15


    steps:


    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0



    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"



    - name: Install dependencies
      run: |

        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi



    # ======================
    # Generate wallpaper
    # ======================
    - name: Generate wallpaper
      run: |

        python main.py



    # ======================
    # Check output
    # ======================
    - name: Verify generated files
      run: |

        test -f output/earth.webp
        test -f output/earth_desktop.webp
        test -f output/earth_phone.webp



    # ======================
    # Commit update
    # ======================
    - name: Commit images
      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"


        git add output history history.json


        git commit \
          -m "update wallpaper" \
          || echo "No changes"


        git pull --rebase origin main


        git push



    # ======================
    # GitHub Pages
    # ======================
    - name: Setup Pages
      uses: actions/configure-pages@v5



    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .



    - name: Deploy Pages
      uses: actions/deploy-pages@v4
