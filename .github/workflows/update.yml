name: Update Himawari Wallpaper


on:

  schedule:

    - cron: "*/10 * * * *"


  workflow_dispatch:


permissions:

  contents: write
  pages: write
  id-token: write



jobs:


  update:


    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Setup Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.12"



    - name: Install dependencies

      run:

        pip install -r requirements.txt



    - name: Generate images

      run:

        python main.py



    - name: Prepare Pages

      run: |

        mkdir -p public

        cp output/earth_phone.webp public/

        cp output/earth_desktop.webp public/



    - name: Upload Pages Artifact

      uses: actions/upload-pages-artifact@v3

      with:

        path: public




  deploy:


    needs: update


    runs-on: ubuntu-latest


    environment:

      name: github-pages


    steps:


    - name: Deploy Pages

      uses: actions/deploy-pages@v4
