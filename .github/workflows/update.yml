name: Update Himawari Wallpaper


on:

  schedule:

    # 每小时运行一次
    # 后续如果需要10分钟一帧改为:
    # */10 * * * *

    - cron: "0 * * * *"


  workflow_dispatch:



permissions:

  contents: write

  pages: write

  id-token: write



jobs:


  update:


    runs-on: ubuntu-latest



    steps:


      # ==========================
      # 获取代码
      # ==========================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0




      # ==========================
      # Python环境
      # ==========================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      - name: Install dependencies

        run: |

          pip install -r requirements.txt





      # ==========================
      # 下载并处理卫星图
      # ==========================

      - name: Generate images

        run: |

          python main.py





      # ==========================
      # 创建网页目录
      # ==========================

      - name: Prepare Pages directory

        run: |


          mkdir -p public/history



          echo "Preparing files..."



          # 当前壁纸

          cp output/earth_desktop.webp \
          public/earth_desktop.webp



          cp output/earth_phone.webp \
          public/earth_phone.webp





          # 更新时间

          date -u +"%Y-%m-%d %H:%M:%S UTC" \
          > public/update.txt





      # ==========================
      # 保存历史帧
      # ==========================

      - name: Save history frame

        run: |


          TIME=$(date -u +"%Y%m%d_%H%M")



          cp output/earth_desktop.webp \
          public/history/earth_${TIME}.webp




          echo "Saved frame:"

          ls -lh public/history





      # ==========================
      # 清理24小时前图片
      # ==========================

      - name: Remove old frames

        run: |


          find public/history \
          -type f \
          -name "*.webp" \
          -mmin +1440 \
          -delete



          echo "After cleanup:"

          ls -lh public/history





      # ==========================
      # 生成播放列表
      # ==========================

      - name: Generate history.json

        run: |


          echo "[" > public/history.json



          find public/history \
          -type f \
          -name "*.webp" \
          | sort \
          | sed 's#public/##' \
          | awk '{print "\"" $0 "\","}' \
          >> public/history.json



          sed -i '$ s/,$//' public/history.json



          echo "]" >> public/history.json



          echo "history.json:"

          cat public/history.json





      # ==========================
      # Pages配置
      # ==========================

      - name: Setup Pages

        uses: actions/configure-pages@v5





      # ==========================
      # 上传Pages
      # ==========================

      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: ./public





  deploy:



    needs: update



    runs-on: ubuntu-latest



    steps:


      # ==========================
      # 发布
      # ==========================

      - name: Deploy to GitHub Pages

        uses: actions/deploy-pages@v4
