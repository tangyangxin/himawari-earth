name: Update Himawari Wallpaper

on:
  repository_dispatch:
    types:
      - update-wallpaper

  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write


# 防止多个 Cloudflare trigger 同时提交导致 git 冲突
concurrency:
  group: himawari-update
  cancel-in-progress: false


jobs:

  update:

    name: update-wallpaper

    runs-on: ubuntu-latest

    timeout-minutes: 15


    steps:


    # -------------------------
    # Checkout
    # -------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0



    # -------------------------
    # Setup Python
    # -------------------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"



    # -------------------------
    # Install dependencies
    # -------------------------
    - name: Install dependencies
      run: |

        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi



    # -------------------------
    # Generate wallpaper
    # -------------------------
    - name: Generate wallpaper
      run: |

        python generate.py



    # -------------------------
    # Update history
    # -------------------------
    - name: Update history
      run: |

        python update_history.py || true



    # -------------------------
    # Clean old history
    # -------------------------
    - name: Clean old history images
      run: |

        python clean_history.py || true



    # -------------------------
    # Commit images
    # -------------------------
    - name: Commit images
      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"


        git status


        git add .


        git commit \
          -m "update wallpaper history" \
          || echo "No changes to commit"



        git pull --rebase origin main



        git push



    # -------------------------
    # Setup Pages
    # -------------------------
    - name: Setup Pages
      uses: actions/configure-pages@v5



    # -------------------------
    # Upload Pages
    # -------------------------
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .



    # -------------------------
    # Deploy Pages
    # -------------------------
    - name: Deploy Pages
      uses: actions/deploy-pages@v4
